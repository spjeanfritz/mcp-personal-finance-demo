[project]
name = "mcp-personal-finance-demo"
version = "0.1.0"
description = "MCP server wrapping the personal-finance FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "httpx",
]

[project.scripts]
mcp-personal-finance-demo = "mcp_personal_finance_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
